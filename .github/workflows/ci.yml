name: repository-contract

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: synaplex
    env:
      SYNAPLEX_CONTEXT_REPOSITORY_ROOT: ${{ github.workspace }}/context-repository
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: synaplex
      - name: Check out canon conformance contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: evanfollis/context-repository
          ref: 96850d3f44e998e774eb67d3af1aa566ab710d57
          path: context-repository
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: synaplex/pyproject.toml
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: synaplex/site/package-lock.json
      - name: Install Python gates
        run: python -m pip install -e '.[dev]'
      - name: Install site
        run: npm ci --prefix site
      - name: Check
        run: make check PYTHON=python PROMPTEVAL=/nonexistent
