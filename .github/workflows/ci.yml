name: repository-contract

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - name: Set up Node
        uses: actions/setup-node@1e60f620b9541d7c243d3c7a1e0b846c098d7555
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install Python gates
        run: python -m pip install -e '.[dev]'
      - name: Install site
        run: npm ci --prefix site
      - name: Check
        run: make check PYTHON=python PROMPTEVAL=/nonexistent
